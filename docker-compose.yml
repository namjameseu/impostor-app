# Development stack: Postgres + FastAPI (auto-reload) + Vite (HMR).
# Copy .env.example to .env to override any of the defaults below.
services:
  db:
    image: postgres:16-alpine
    container_name: impostor_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impostor}
      POSTGRES_USER: ${POSTGRES_USER:-impostor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-impostor}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-impostor}:${POSTGRES_PASSWORD:-impostor}@db:5432/${POSTGRES_DB:-impostor}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Set in .env to hide the words behind a passcode; empty = library open to everyone.
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
